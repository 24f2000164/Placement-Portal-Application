services:
  - type: web
    name: ppa-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ppa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ppa-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ppa-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ppa-redis
          type: keyvalue
          property: connectionString
      - key: MAIL_USERNAME
        value: yourgmail@gmail.com
      - key: MAIL_PASSWORD
        value: your-app-password
      - key: MAIL_DEFAULT_SENDER
        value: yourgmail@gmail.com
      - key: FLASK_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://your-netlify-app.netlify.app

  - type: keyvalue
    name: ppa-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: ppa-db
    databaseName: ppa
    user: ppa_user
    plan: free